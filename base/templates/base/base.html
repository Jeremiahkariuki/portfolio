<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jeremiah Kariuki Beth - Backend Developer specializing in Python, Django, QA Testing, Odoo & Cloud Services. Available for hire from Nairobi, Kenya.">
    <title>Jeremiah Kariuki | Backend Developer</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'base/css/style.css' %}">
</head>
<body>

<!-- Fixed background -->
<div class="bg-layer" style="background-image: url('{% static 'base/images/image1.jpeg' %}');"></div>
<div class="bg-overlay"></div>

<!-- Navbar -->
<nav class="navbar" id="navbar">
    <div class="nav-inner">
        <a href="{% url 'home' %}" class="nav-brand">JK<span>.</span></a>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'projects' %}">Projects</a>
            <a href="{% url 'contacts' %}">Contact</a>
        </div>
    </div>
</nav>

<!-- Page content -->
<main class="page-content">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="footer">
    <p>© 2025 Jeremiah Kariuki Beth &mdash; Built with Django &amp; ❤️ &mdash; Nairobi, Kenya</p>
</footer>

<script>
    // Navbar scroll effect
    window.addEventListener('scroll', () => {
        const nav = document.getElementById('navbar');
        if (window.scrollY > 30) {
            nav.classList.add('scrolled');
        } else {
            nav.classList.remove('scrolled');
        }
    });

    // Animate elements on load
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.fade-in').forEach((el, i) => {
            el.style.animationDelay = `${i * 0.12}s`;
        });
    });
</script>
</body>
</html>
