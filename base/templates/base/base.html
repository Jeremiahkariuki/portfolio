
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jeremiah Portfolio</title>

    {% load static %}
    <!-- Inlined stylesheet (temporary - used for debugging client-side application issues) -->
    <style>
/* ===== RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ===== BODY ===== */
html, body {
    font-family: 'Segoe UI', sans-serif;
    color: #ffffff;
    min-height: 100vh;
}

/* page background */
body {
    background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url("{% static 'base/images/image1.jpeg' %}");
    background-size: cover;
    background-position: center;
}

/* ===== CONTAINER ===== */
.container {
    width: 85%;
    margin: auto;
    max-width: 1200px;
}

/* ===== HERO SECTION ===== */
h1 {
    font-size: 3rem;
    margin-top: 120px;
    font-weight: 700;
}

h3 {
    margin-top: 10px;
    font-weight: 400;
    color: #00d4ff;
}

/* ===== INTRO TEXT ===== */
.intro {
    margin-top: 25px;
    line-height: 1.7;
    max-width: 600px;
    font-size: 1.05rem;
    color: #dddddd;
}

/* ===== BUTTONS ===== */
.hero-buttons {
    margin-top: 35px;
    text-align: center;
}

.hero-buttons a {
    text-decoration: none;
    padding: 12px 25px;
    border-radius: 30px;
    font-weight: 600;
    margin-right: 15px;
    transition: 0.3s ease;
    display: inline-block;
}

/* ===== NAVBAR ===== */
.navbar {
    text-align: center;
    padding: 20px 0;
    background: rgba(0,0,0,0.3);
}
.navbar a {
    display: inline-block;
    margin: 0 15px;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
}
.navbar a:hover {
    color: #00d4ff;
}

.btn-primary {
    background: #00d4ff;
    color: black;
}

.btn-primary:hover {
    background: white;
}

.btn-outline {
    border: 2px solid #00d4ff;
    color: #00d4ff;
}

.btn-outline:hover {
    background: #00d4ff;
    color: black;
}

/* ===== SKILLS SECTION ===== */
.skills-preview {
    margin-top: 80px;
}

.skills-preview h3 {
    margin-bottom: 20px;
    font-size: 1.5rem;
    color: white;
}

.tag {
    display: inline-block;
    padding: 8px 15px;
    margin: 6px 8px 0 0;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    font-size: 0.9rem;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.3s;
}

.tag:hover {
    background: #00d4ff;
    color: black;
}
    </style>
</head>
<body style="background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('{% static 'base/images/image1.jpeg' %}'); background-size: cover; background-position: center; color: #ffffff;">

<nav class="navbar">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'contacts' %}">Contact</a>
    <a href="{% url 'projects' %}">Projects</a>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
